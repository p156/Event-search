<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体験型イベントまとめ | イマーシブ・脱出・謎解き（大人向け・全国）</title>
<meta name="description" content="大人でも楽しめる体験型イベント（イマーシブ／脱出ゲーム／謎解き／マーダーミステリー等）を全国から収集したまとめサイト。期間限定イベントと常設店舗を分けて掲載。">
<style>
  :root{
    --bg:#faf7f2; --card:#ffffff; --ink:#2b2620; --muted:#8a7f70; --line:#e7ded2;
    --accent:#b3541e; --accent-soft:#f6e3d3; --red:#c0392b; --chip:#f1e9dd;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:28px 16px 8px;max-width:1080px;margin:0 auto}
  h1{font-size:24px;margin:0 0 6px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 4px}
  .updated{color:var(--muted);font-size:12px}
  main{max-width:1080px;margin:0 auto;padding:8px 16px 48px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tab .n{opacity:.75;font-size:12px;margin-left:4px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
  .toolbar input[type=search]{flex:1;min-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--card)}
  .toolbar button{padding:9px 12px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-size:13px}
  .filters{display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px;margin-bottom:14px}
  .filters.open{display:block}
  .filters h3{font-size:12px;color:var(--muted);margin:10px 0 6px}
  .filters h3:first-child{margin-top:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card img{width:100%;height:160px;object-fit:cover;background:var(--accent-soft);display:block}
  .card .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card h2{font-size:16px;margin:0;line-height:1.45}
  .meta{font-size:12.5px;color:var(--muted);line-height:1.6}
  .price{font-size:13px}
  .genres{display:flex;gap:5px;flex-wrap:wrap}
  .genre{font-size:11px;background:var(--chip);border-radius:4px;padding:2px 7px}
  .badge{align-self:flex-start;font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--accent-soft);color:var(--accent);font-weight:600}
  .badge.soon{background:#fbe3de;color:var(--red)}
  .links{display:flex;gap:8px;margin-top:auto;padding-top:6px}
  .links a{font-size:13px;text-decoration:none;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:6px 12px}
  .links a.ticket{background:var(--accent);color:#fff}
  details{font-size:13px;line-height:1.7;border-top:1px dashed var(--line);padding-top:8px}
  details summary{cursor:pointer;color:var(--accent);font-size:12.5px}
  .runs{margin:6px 0 0;padding-left:16px}
  .prods{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
  .prods li{border-top:1px dashed var(--line);padding-top:8px}
  .prods .pt{font-weight:600;font-size:13.5px;line-height:1.5}
  .prods .pm{font-size:12px;color:var(--muted);line-height:1.6}
  .prods .pl{display:flex;gap:8px;margin-top:4px}
  .prods .pl a{font-size:12px;text-decoration:none;border:1px solid var(--accent);color:var(--accent);border-radius:6px;padding:3px 9px}
  .prods .pl a.ticket{background:var(--accent);color:#fff}
  .preview{font-size:12.5px;color:var(--muted);line-height:1.7}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  footer{max-width:1080px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:12px;line-height:1.7}
</style>
</head>
<body>
<header>
  <h1>体験型イベントまとめ</h1>
  <p class="sub">大人でも／むしろ大人が楽しめる、イマーシブ・脱出・謎解きなどの期間限定イベントを全国から収集。常設店舗は別タブに分けています。</p>
  <p class="updated" id="updated"></p>
</header>
<main>
  <nav class="tabs" id="tabs"></nav>
  <div class="toolbar">
    <input type="search" id="q" placeholder="タイトル・会場・地域で検索">
    <button id="filterBtn" type="button">絞り込み（ジャンル・地域）</button>
  </div>
  <section class="filters" id="filters">
    <h3>ジャンル</h3>
    <div class="chips" id="genreChips"></div>
    <h3>地域</h3>
    <div class="chips" id="regionChips"></div>
  </section>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" style="display:none">条件に合うイベントがありません。</p>
</main>
<footer>
  <p>掲載情報は各公式ページに基づきます。日程・料金・販売方法は変更される場合があるため、参加前に公式ページでご確認ください。画像は各公式ページのものをリンク表示しています。</p>
</footer>
<script>
const GENRES = ["謎解き","脱出ゲーム","イマーシブ","マーダーミステリー","ホラー","周遊型","展示","宿泊型","ARG・オンライン","その他"];
const TABS = [
  {key:"now", label:"開催中"},
  {key:"upcoming", label:"開催予定"},
  {key:"past", label:"終了済み"},
  {key:"online", label:"オンライン・ARG"},
  {key:"store", label:"常設店舗"},
];
let DATA = [], tab = "now", genreSel = new Set(), regionSel = new Set(), query = "";

function todayJST(){
  const now = new Date();
  const jst = new Date(now.getTime() + (9*60 + now.getTimezoneOffset())*60000);
  return jst.toISOString().slice(0,10);
}
const TODAY = todayJST();

function tabOf(e){
  if (e.venueType === "permanent") return "store";
  if (e.category === "online") return "online";
  if (e.endDate && e.endDate < TODAY) return "past";
  if (e.startDate && e.startDate > TODAY) return "upcoming";
  return "now";
}
function daysLeft(e){
  if (!e.endDate) return null;
  const ms = new Date(e.endDate+"T00:00:00") - new Date(TODAY+"T00:00:00");
  return Math.round(ms/86400000);
}
function fmtDate(s){ return s ? s.replace(/-/g,"/") : ""; }
function period(e){
  if (e.ongoing && !e.endDate) return "常時開催";
  const a = fmtDate(e.startDate), b = fmtDate(e.endDate);
  if (a && b) return a+" 〜 "+b;
  return a || b || "";
}
function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function renderTabs(){
  const counts = {};
  DATA.forEach(e => { const t = tabOf(e); counts[t] = (counts[t]||0)+1; });
  counts.store = new Set(DATA.filter(e => e.venueType === "permanent").map(storeKey)).size;
  document.getElementById("tabs").innerHTML = TABS.map(t =>
    `<button class="tab ${t.key===tab?"active":""}" data-tab="${t.key}">${t.label}<span class="n">${counts[t.key]||0}</span></button>`
  ).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
}
function renderChips(){
  const gc = document.getElementById("genreChips");
  gc.innerHTML = GENRES.map(g => `<span class="chip ${genreSel.has(g)?"active":""}" data-g="${g}">${g}</span>`).join("");
  gc.querySelectorAll(".chip").forEach(c => c.onclick = () => { genreSel.has(c.dataset.g) ? genreSel.delete(c.dataset.g) : genreSel.add(c.dataset.g); render(); });
  const regions = [...new Set(DATA.map(e => e.region).filter(Boolean))].sort();
  const rc = document.getElementById("regionChips");
  rc.innerHTML = regions.map(r => `<span class="chip ${regionSel.has(r)?"active":""}" data-r="${esc(r)}">${esc(r)}</span>`).join("");
  rc.querySelectorAll(".chip").forEach(c => c.onclick = () => { regionSel.has(c.dataset.r) ? regionSel.delete(c.dataset.r) : regionSel.add(c.dataset.r); render(); });
}
function matches(e){
  if (tabOf(e) !== tab) return false;
  if (genreSel.size && !e.genres.some(g => genreSel.has(g))) return false;
  if (regionSel.size && !regionSel.has(e.region)) return false;
  if (query){
    const hay = [e.title, e.venue, e.prefecture, e.region, (e.genres||[]).join(" ")].join(" ");
    if (!hay.includes(query)) return false;
  }
  return true;
}
function badge(e){
  const d = daysLeft(e);
  if (tab === "past" || d === null || d < 0) return "";
  if (d === 0) return `<span class="badge soon">本日最終日</span>`;
  if (d <= 14) return `<span class="badge soon">あと${d}日</span>`;
  if (tab === "now") return `<span class="badge">あと${d}日</span>`;
  return "";
}
function card(e){
  const img = e.imageUrl ? `<img src="${esc(e.imageUrl)}" alt="" loading="lazy" onerror="this.remove()">` : "";
  const runs = (e.runs||[]).length > 1
    ? `<ul class="runs">${e.runs.map(r => `<li>${esc(r.venue||"")}（${period(r)}）</li>`).join("")}</ul>` : "";
  const detail = (e.description || e.datesNote || runs)
    ? `<details><summary>詳細</summary>${e.description?`<p>${esc(e.description)}</p>`:""}${e.datesNote?`<p>${esc(e.datesNote)}</p>`:""}${runs}</details>` : "";
  return `<article class="card">${img}<div class="body">
    <h2>${esc(e.title)}</h2>
    ${badge(e)}
    <div class="meta">${esc(e.venue||"")}<br>${period(e)}${e.prefecture?` ・ ${esc(e.prefecture)}`:""}</div>
    ${e.priceText?`<div class="price">${esc(e.priceText)}</div>`:""}
    <div class="genres">${(e.genres||[]).map(g=>`<span class="genre">${esc(g)}</span>`).join("")}</div>
    ${detail}
    <div class="links">
      ${e.eventUrl?`<a href="${esc(e.eventUrl)}" target="_blank" rel="noopener">公式ページ</a>`:""}
      ${e.ticketUrl?`<a class="ticket" href="${esc(e.ticketUrl)}" target="_blank" rel="noopener">チケット・参加</a>`:""}
    </div>
  </div></article>`;
}
function storeKey(e){
  let v = (e.venue||"").replace(/（[^）]*）/g,"").trim();
  v = v.split("／")[0].trim();
  if (v.startsWith("東京ミステリーサーカス")) return "東京ミステリーサーカス";
  return v || e.title;
}
function prodKey(e){
  return e.title.replace(/（[^）]*）\s*$/,"").replace(/\s+/g,"");
}
function dedupeProds(list){
  const map = new Map();
  for (const e of list){
    const k = prodKey(e);
    const cur = map.get(k);
    if (!cur){ map.set(k, e); continue; }
    const score = x => (x.endDate||"9999") + (x.ticketUrl?1:0) + (x.imageUrl?1:0);
    if (score(e) > score(cur)) map.set(k, e);
  }
  return [...map.values()];
}
function prodState(e){
  if (e.endDate && e.endDate < TODAY) return "past";
  if (e.startDate && e.startDate > TODAY) return "upcoming";
  return "now";
}
function prodRow(e){
  return `<li><div class="pt">${esc(e.title)}</div>
    <div class="pm">${period(e)}${e.priceText?` ・ ${esc(e.priceText)}`:""}</div>
    <div class="pl">${e.eventUrl?`<a href="${esc(e.eventUrl)}" target="_blank" rel="noopener">公式</a>`:""}${e.ticketUrl?`<a class="ticket" href="${esc(e.ticketUrl)}" target="_blank" rel="noopener">チケット・参加</a>`:""}</div></li>`;
}
function storeCard(name, prods){
  const now = prods.filter(e => prodState(e)==="now");
  const up = prods.filter(e => prodState(e)==="upcoming");
  const past = prods.filter(e => prodState(e)==="past");
  const first = prods[0];
  const withImg = prods.find(e => e.imageUrl);
  const counts = [now.length?`開催中${now.length}件`:"", up.length?`開催予定${up.length}件`:""].filter(Boolean).join("・");
  const preview = now.slice(0,3).map(e => esc(e.title)).join("<br>");
  const sections = [
    now.length?`<p class="pm" style="font-weight:600;font-size:12.5px">いまやってる公演</p><ul class="prods">${now.map(prodRow).join("")}</ul>`:"",
    up.length?`<p class="pm" style="font-weight:600;font-size:12.5px">開催予定</p><ul class="prods">${up.map(prodRow).join("")}</ul>`:"",
    past.length?`<p class="pm" style="font-weight:600;font-size:12.5px">終了済み</p><ul class="prods">${past.map(prodRow).join("")}</ul>`:"",
  ].join("");
  return `<article class="card">${withImg?`<img src="${esc(withImg.imageUrl)}" alt="" loading="lazy" onerror="this.remove()">`:""}<div class="body">
    <h2>${esc(name)}</h2>
    <div class="meta">${esc(first.prefecture||"")}${first.region?` ・ ${esc(first.region)}`:""}<br>${counts}</div>
    ${preview?`<div class="preview">${preview}</div>`:""}
    <details><summary>公演一覧（${prods.length}件）</summary>${sections}</details>
  </div></article>`;
}
function storeMatches(name, prods){
  if (regionSel.size && !prods.some(e => regionSel.has(e.region))) return false;
  if (genreSel.size && !prods.some(e => (e.genres||[]).some(g => genreSel.has(g)))) return false;
  if (query){
    const hay = name + " " + prods.map(e => [e.title, e.venue, e.prefecture].join(" ")).join(" ");
    if (!hay.includes(query)) return false;
  }
  return true;
}
function renderStores(){
  const groups = new Map();
  DATA.filter(e => e.venueType === "permanent").forEach(e => {
    const k = storeKey(e);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(e);
  });
  const cards = [];
  groups.forEach((prods, name) => {
    const dd = dedupeProds(prods);
    if (storeMatches(name, dd)) cards.push(storeCard(name, dd));
  });
  document.getElementById("grid").innerHTML = cards.join("");
  document.getElementById("empty").style.display = cards.length ? "none" : "block";
}
function render(){
  renderTabs(); renderChips();
  if (tab === "store"){ renderStores(); return; }
  const list = DATA.filter(matches);
  list.sort((a,b) => (a.endDate||"9999").localeCompare(b.endDate||"9999"));
  document.getElementById("grid").innerHTML = list.map(card).join("");
  document.getElementById("empty").style.display = list.length ? "none" : "block";
}
document.getElementById("q").addEventListener("input", ev => { query = ev.target.value.trim(); render(); });
document.getElementById("filterBtn").onclick = () => document.getElementById("filters").classList.toggle("open");

fetch("events.json").then(r => r.json()).then(j => {
  DATA = j.events || [];
  document.getElementById("updated").textContent = `収録 ${DATA.length} 件（${j.generatedAt} 時点のデータ）`;
  render();
}).catch(() => {
  document.getElementById("empty").style.display = "block";
  document.getElementById("empty").textContent = "データを読み込めませんでした。";
});
</script>
</body>
</html>
